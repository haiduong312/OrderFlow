name: orderflow-observability
services:
  telemetry:
    profiles: ["telemetry"]
    image: grafana/otel-lgtm:0.41.0@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    ports:
      - "127.0.0.1:${ORDERFLOW_TELEMETRY_UI_PORT:-3000}:3000"
      - "127.0.0.1:${ORDERFLOW_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      ENABLE_LOGS_ALL: "false"
    volumes:
      - ./infra/telemetry/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/orderflow.yaml:ro
      - ./infra/telemetry/orderflow.json:/otel-lgtm/orderflow-dashboard.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:13133/ready"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 15s
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 20s
