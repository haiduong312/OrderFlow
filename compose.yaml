services:
  postgres:
    profiles: ["dev"]
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${ORDERFLOW_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 uses versioned PGDATA beneath /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

  rabbitmq:
    profiles: ["dev", "messaging"]
    image: rabbitmq:4.4.0-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    hostname: orderflow-rabbitmq
    entrypoint: ["/bin/sh", "/usr/local/bin/orderflow-rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: orderflow_dev
      RABBITMQ_DEFAULT_VHOST: orderflow
      RABBITMQ_NODENAME: rabbit@orderflow-rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +SDcpu 1 +SDio 1"
    secrets:
      - rabbitmq_password
    ports:
      - "127.0.0.1:${ORDERFLOW_RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${ORDERFLOW_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/entrypoint.sh:/usr/local/bin/orderflow-rabbitmq-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  mailpit:
    profiles: ["dev", "email"]
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "0"
      MP_IGNORE_DUPLICATE_IDS: "false"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_QUIET: "true"
    ports:
      - "127.0.0.1:${ORDERFLOW_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${ORDERFLOW_MAIL_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  redis:
    profiles: ["dev", "realtime"]
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${ORDERFLOW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    stop_grace_period: 10s

secrets:
  rabbitmq_password:
    file: ${ORDERFLOW_RABBIT_PASSWORD_FILE:-./.local/rabbitmq-password}
  postgres_password:
    file: ${ORDERFLOW_DB_PASSWORD_FILE:?Set ORDERFLOW_DB_PASSWORD_FILE to a private password file}

volumes:
  mailpit_data:
  rabbitmq_data:
  postgres_data:
