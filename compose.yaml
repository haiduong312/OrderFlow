services:
  postgres:
    profiles: ["dev"]
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${ORDERFLOW_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 uses versioned PGDATA beneath /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ${ORDERFLOW_DB_PASSWORD_FILE:?Set ORDERFLOW_DB_PASSWORD_FILE to a private password file}

volumes:
  postgres_data:
